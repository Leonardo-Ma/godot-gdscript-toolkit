- id: gdlint
  name: gdlint
  description: "gdlint - linter for GDScript"
  entry: gdlint
  language: python
  language_version: python3
  require_serial: true
  types: [gdscript]
  
- id: gdformat
  name: gdformat
  description: "gdformat - formatter for GDScript"
  entry: gdformat
  language: python
  language_version: python3
  require_serial: true
  types: [gdscript]
  
- id: gdradon
  name: gdradon
  description: "gdradon - cyclomatic complexity checker for GDScript"
  entry: gdradon cc
  language: python
  language_version: python3
  require_serial: true
  types: [gdscript]
  args: [--max-complexity=10]

